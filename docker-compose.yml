version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentriq-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://sentriq_user:sentriq_pass@db:5432/sentriq_db
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - IP_INTEL_SERVICE_URL=https://api.ip-intel.internal
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: sentriq-db
    restart: always
    environment:
      - POSTGRES_USER=sentriq_user
      - POSTGRES_PASSWORD=sentriq_pass
      - POSTGRES_DB=sentriq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentriq_user -d sentriq_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
